# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# exec-on-workspace-change = [
#   '/bin/bash',
#   '-c',
#   'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
# ]

on-focus-changed = ['move-mouse window-lazy-center']

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 16

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
  preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
  inner.horizontal = 8
  inner.vertical = 8
  outer.left = 8
  outer.bottom = 8
  # SketchyBar is 40px tall with a 6px y-offset; leave a little breathing room.
  outer.top = 8
  outer.right = 8

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

  # All possible keys:
  # - Letters.        a, b, c, ..., z
  # - Numbers.        0, 1, 2, ..., 9
  # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
  # - F-keys.         f1, f2, ..., f20
  # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
  #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
  #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
  #                   sectionSign (ISO keyboards only, european keyboards only)
  # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
  #                   keypadMinus, keypadMultiply, keypadPlus
  # - Arrows.         left, down, up, right

  # All possible modifiers: cmd, alt, ctrl, shift

  # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

  # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
  # Launch terminal with alt-enter (like i3)
  # alt-enter = 'exec-and-forget open -b com.mitchellh.ghostty'

  # See: https://nikitabobko.github.io/AeroSpace/commands#layout
  alt-slash = 'layout tiles horizontal vertical'
  alt-comma = 'layout accordion horizontal vertical'

  # See: https://nikitabobko.github.io/AeroSpace/commands#focus
  alt-h = 'focus --boundaries all-monitors-outer-frame left'
  alt-j = 'focus --boundaries all-monitors-outer-frame down'
  alt-k = 'focus --boundaries all-monitors-outer-frame up'
  alt-l = 'focus --boundaries all-monitors-outer-frame right'

  # See: https://nikitabobko.github.io/AeroSpace/commands#move
  alt-shift-h = 'move left'
  alt-shift-j = 'move down'
  alt-shift-k = 'move up'
  alt-shift-l = 'move right'

  # See: https://nikitabobko.github.io/AeroSpace/commands#resize
  alt-minus = 'resize smart -50'
  alt-equal = 'resize smart +50'

  # Window management
  alt-shift-space = 'fullscreen'
  alt-shift-equal = 'balance-sizes'
  alt-shift-q = 'close'

  # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
  # alt = go to a CONTEXT.  hyper = jump to an APP (see "Hyper app keys" below).
  #   A  Agents     T3 Code + Orca (stack them: alt-, then alt-h/l flips)
  #   T  Terminal   Ghostty
  #   W  Web        browsers
  #   C  Chat       WhatsApp, Discord, OpenBot
  #   0  Parking    Obsidian, TickTick, Spotify
  #   1-3 Scratch   pop a window out for a side-by-side
  alt-1 = 'workspace 1'
  alt-2 = 'workspace 2'
  alt-3 = 'workspace 3'
  alt-0 = 'workspace 0' # Parking
  alt-a = 'workspace A' # (A)gents
  alt-t = 'workspace T' # (T)erminal
  alt-w = 'workspace W' # (W)eb
  alt-c = 'workspace C' # (C)hat

  # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
  alt-shift-1 = 'move-node-to-workspace 1'
  alt-shift-2 = 'move-node-to-workspace 2'
  alt-shift-3 = 'move-node-to-workspace 3'
  alt-shift-0 = 'move-node-to-workspace 0'
  alt-shift-a = 'move-node-to-workspace A'
  alt-shift-t = 'move-node-to-workspace T'
  alt-shift-w = 'move-node-to-workspace W'
  alt-shift-c = 'move-node-to-workspace C'

  # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
  alt-tab = 'workspace-back-and-forth'
  alt-leftSquareBracket = 'workspace --wrap-around prev'
  alt-rightSquareBracket = 'workspace --wrap-around next'

  # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
  alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

  # Monitor focus (for multi-monitor setups)
  alt-ctrl-h = 'focus-monitor left'
  alt-ctrl-l = 'focus-monitor right'
  alt-ctrl-j = 'focus-monitor down'
  alt-ctrl-k = 'focus-monitor up'

  # Hyper layer (ctrl-alt-shift-cmd): one-shot layout surgery, no mode needed.
  #   hyper + h/j/k/l -> stack focused window with its neighbour (tabbed/accordion)
  #   hyper + f       -> (F)loat <-> tiling toggle
  #   hyper + r       -> (R)eset: unstack everything on the workspace
  #   hyper + ;       -> layout mode (sticky, for multi-step edits)
  ctrl-alt-shift-cmd-h = ['join-with left', 'layout accordion']
  ctrl-alt-shift-cmd-j = ['join-with down', 'layout accordion']
  ctrl-alt-shift-cmd-k = ['join-with up', 'layout accordion']
  ctrl-alt-shift-cmd-l = ['join-with right', 'layout accordion']
  ctrl-alt-shift-cmd-f = 'layout floating tiling'
  ctrl-alt-shift-cmd-r = 'flatten-workspace-tree'

  # Hyper app keys: focus the app wherever it lives (launches it if closed);
  # AeroSpace follows it to its workspace.
  ctrl-alt-shift-cmd-3 = 'exec-and-forget open -b com.t3tools.t3code'     # T(3) Code
  ctrl-alt-shift-cmd-o = 'exec-and-forget open -b com.stablyai.orca'      # (O)rca
  ctrl-alt-shift-cmd-b = 'exec-and-forget open -b app.openbot.desktop'    # Open(B)ot
  ctrl-alt-shift-cmd-g = 'exec-and-forget open -b com.mitchellh.ghostty'  # (G)hostty
  ctrl-alt-shift-cmd-z = 'exec-and-forget open -b app.zen-browser.zen'    # (Z)en
  ctrl-alt-shift-cmd-w = 'exec-and-forget open -b net.whatsapp.WhatsApp'  # (W)hatsApp
  ctrl-alt-shift-cmd-d = 'exec-and-forget open -b com.hnc.Discord'        # (D)iscord
  ctrl-alt-shift-cmd-n = 'exec-and-forget open -b md.obsidian'            # (N)otes - Obsidian
  ctrl-alt-shift-cmd-m = 'exec-and-forget open -b com.spotify.client'     # (M)usic - Spotify
  ctrl-alt-shift-cmd-t = 'exec-and-forget open -b com.TickTick.task.mac'  # (T)ickTick

  # See: https://nikitabobko.github.io/AeroSpace/commands#mode
  ctrl-alt-shift-cmd-semicolon = 'mode service'

# 'service' (layout) mode: STICKY - every key keeps you in the mode so you
# can chain edits (stack, move, resize...). Leave with esc or enter.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
  esc = ['reload-config', 'mode main'] # exit + reload config
  enter = 'mode main'                  # exit

  # h/j/k/l        -> focus (same as alt-h/j/k/l, minus the alt)
  h = 'focus left'
  j = 'focus down'
  k = 'focus up'
  l = 'focus right'

  # shift-h/j/k/l  -> move window
  shift-h = 'move left'
  shift-j = 'move down'
  shift-k = 'move up'
  shift-l = 'move right'

  # ctrl-h/j/k/l   -> join (stack) with neighbour
  ctrl-h = ['join-with left', 'layout accordion']
  ctrl-j = ['join-with down', 'layout accordion']
  ctrl-k = ['join-with up', 'layout accordion']
  ctrl-l = ['join-with right', 'layout accordion']

  o = 'layout horizontal vertical'   # (O)rientation flip
  f = 'layout floating tiling'       # (F)loat <-> tiling
  r = 'flatten-workspace-tree'       # (R)eset layout
  b = 'balance-sizes'                # (B)alance
  minus = 'resize smart -50'
  equal = 'resize smart +50'
  backspace = ['close-all-windows-but-current', 'mode main']

  down = 'volume down'
  up = 'volume up'
  shift-down = ['volume set 0', 'mode main']

  # AI agents

[[on-window-detected]]
  if.app-id = 'com.t3tools.t3code'
  run = 'move-node-to-workspace A'     # mnemonics A - Agents

[[on-window-detected]]
  if.app-id = 'com.stablyai.orca'
  run = 'move-node-to-workspace A'

  # Terminal

[[on-window-detected]]
  if.app-id = 'com.mitchellh.ghostty'
  run = 'move-node-to-workspace T'     # mnemonics T - Terminal

  # Browser

[[on-window-detected]]
  if.app-id = 'company.thebrowser.Browser'
  run = 'move-node-to-workspace W'         # mnemonics W - Web browser

[[on-window-detected]]
  if.app-id = 'app.zen-browser.zen'
  run = 'move-node-to-workspace W'

[[on-window-detected]]
  if.app-id = 'net.imput.helium'
  run = 'move-node-to-workspace W'

  # Parking (rarely used)

[[on-window-detected]]
  if.app-id = 'md.obsidian'
  run = 'move-node-to-workspace 0'

[[on-window-detected]]
  if.app-id = 'com.TickTick.task.mac'
  run = 'move-node-to-workspace 0'

[[on-window-detected]]
  if.app-id = 'com.spotify.client'
  run = 'move-node-to-workspace 0'

  # Chat (humans and bots)

[[on-window-detected]]
  if.app-id = 'net.whatsapp.WhatsApp'
  run = 'move-node-to-workspace C'     # mnemonics C - Chat

[[on-window-detected]]
  if.app-id = 'app.openbot.desktop'
  run = 'move-node-to-workspace C'

[[on-window-detected]]
  if.app-id = 'com.hnc.Discord'
  run = 'move-node-to-workspace C'
